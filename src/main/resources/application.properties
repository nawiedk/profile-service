spring.application.name=profile-service
spring.datasource.url=jdbc:postgresql://localhost:5432/profiledb_dev
spring.datasource.username=postgres
spring.datasource.password=root01
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=off
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=off
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
logging.level.com.nawiedk.profile.adapter.in.web.ProfileController=WARN
server.forward-headers-strategy=native
application.security.jwt.secret=${JWT_SECRET}
application.security.jwt.expiration=${JWT_EXPIRATION}
server.port=8080