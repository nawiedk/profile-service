## Specifies the package(s) where Cucumber will look for step definitions and Spring configuration
#cucumber.glue=com.nawiedk.profile.acceptance
## Specifies the location of your feature files on the classpath
## Feature files are in src/test/resources/features/
#cucumber.features=classpath:features
## Optional: You can specify plugins here, e.g., for reporting
## cucumber.plugin=pretty, html:target/cucumber-reports/cucumber-pretty.html, json:target/cucumber-reports/CucumberTestReport.json